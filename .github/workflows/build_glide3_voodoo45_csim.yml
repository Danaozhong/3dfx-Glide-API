name: Build Glide3x for Voodoo4/5 Library (HAL_CSIM, chip simulator stub)

# Builds Glide3x with HAL_CSIM, where the hardware is accessed through the
# chip simulator interface instead of minihwc. The simulator is replaced by a
# fake board (swlibs/csim), which the integration tests in tests/csim run
# against: on Linux (GCC, x64 and x32) and on Windows (MSVC, x64 and x32).
# The MinGW cross builds do not build the tests: GoogleTest needs std::mutex,
# which MinGW with the win32 thread model does not have.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_csim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    container:
      image: 'ghcr.io/danaozhong/3dfx_glide_dev_env_linux_x64:latest'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Fx Build Number Tool
      working-directory: "glide3x/h5/glide3/src/"
      run: |
        mkdir -p fxbldno_tool/bin
        cd fxbldno_tool/bin
        cmake ..
        cmake --build .

    - name: Generate Build Number Header Files
      working-directory: "glide3x/h5/glide3/src/"
      run: |
        ./fxbldno_tool/bin/fxbldno  > fxbldno.h

    - name: Generate Glide3x Dynamic Link Library (HAL_CSIM, Linux, x64)
      run: |
        mkdir bin_csim_x64
        cd bin_csim_x64
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_HAL_CSIM=ON -DGLIDE_BUILD_TESTS=ON ..
        cmake --build .

    - name: Run Integration Tests (HAL_CSIM, Linux, x64)
      working-directory: bin_csim_x64
      run: |
        ctest --output-on-failure

    - name: Generate Glide3x Dynamic Link Library (HAL_CSIM, Linux, x32)
      run: |
        mkdir bin_csim_x32
        cd bin_csim_x32
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_HAL_CSIM=ON -DGLIDE_BUILD_TESTS=ON -DBUILD_32BIT=ON ..
        cmake --build .

    - name: Run Integration Tests (HAL_CSIM, Linux, x32)
      working-directory: bin_csim_x32
      run: |
        ctest --output-on-failure

    - name: Generate Glide3x Dynamic Link Library (HAL_CSIM, Windows, GCC cross compile, x64)
      run: |
        mkdir bin_csim_win_x64
        cd bin_csim_win_x64
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_HAL_CSIM=ON -DCMAKE_TOOLCHAIN_FILE=mingw-w64-x86_64.cmake ..
        cmake --build .

    - name: Generate Glide3x Dynamic Link Library (HAL_CSIM, Windows, GCC cross compile, x32)
      run: |
        mkdir bin_csim_win_x32
        cd bin_csim_win_x32
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_HAL_CSIM=ON -DBUILD_32BIT=ON -DCMAKE_TOOLCHAIN_FILE=mingw-w64-x86_32.cmake ..
        cmake --build .

    - name: Check that the simulator interface is used
      run: |
        for lib in bin_csim_x64/glide3x/h5/libglide3x_csim.so bin_csim_x32/glide3x/h5/libglide3x_csim.so; do
          test -f "$lib"
          nm -D "$lib" | grep -w csimInit
          nm -D "$lib" | grep -w fxHalInit
          nm -D "$lib" | grep -w halStore32
        done

    - name: Upload Built Glide3x Library
      uses: actions/upload-artifact@v4
      with:
        name: gcc_glide3x_voodoo45_csim_${{ matrix.build_type }}
        path: |
            bin_csim_x32/glide3x/h5/*.so
            bin_csim_x64/glide3x/h5/*.so
            bin_csim_win_x64/glide3x/h5/*.dll
            bin_csim_win_x32/glide3x/h5/*.dll

  test_csim_msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        arch: [x64, Win32]
        include:
          - arch: x64
            cmake_args: ""
          - arch: Win32
            cmake_args: "-DBUILD_32BIT=ON"

    steps:
    - uses: ilammy/setup-nasm@v1
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Fx Build Number Tool
      working-directory: "glide3x/h5/glide3/src/"
      run: |
        mkdir fxbldno_tool/bin
        cd fxbldno_tool/bin
        cmake -DCMAKE_GENERATOR_PLATFORM=Win32 ..
        cmake --build .

    - name: Generate Build Number Header Files
      working-directory: "glide3x/h5/glide3/src/"
      run: |
        ./fxbldno_tool/bin/Debug/fxbldno.exe  > fxbldno.h

    - name: Generate Glide3x Dynamic Link Library (HAL_CSIM, Windows, MSVC, ${{ matrix.arch }})
      run: |
        mkdir bin_csim
        cd bin_csim
        cmake -A ${{ matrix.arch }} ${{ matrix.cmake_args }} -DBUILD_HAL_CSIM=ON -DGLIDE_BUILD_TESTS=ON ..
        cmake --build . --config ${{ matrix.build_type }}

    - name: Run Integration Tests (HAL_CSIM, Windows, MSVC, ${{ matrix.arch }})
      working-directory: bin_csim
      run: |
        ctest -C ${{ matrix.build_type }} --output-on-failure
