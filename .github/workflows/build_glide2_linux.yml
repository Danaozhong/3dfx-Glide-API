name: Build Glide2x Library (Linux X64)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "glide2x/cvg"
    container:
      image: 'danaozhong/3dfx_glide_dev_env_linux_x64:latest'
      
    env:
      # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
      BUILD_TYPE: Debug
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Artifact Directory
      run: |
        mkdir -p ${{ github.workspace }}/artifacts
        
    - name: Generate Glide2x Dynamic Link Library (Linux, x64)
      run: |
        mkdir bin_x64
        cd bin_x64
        cmake ..
        cmake --build .
        
    - name: Generate Glide2x Dynamic Link Library (Linux, x32)
      run: |
        mkdir bin_x32
        cd bin_x32
        cmake -DBUILD_32BIT=ON ..
        cmake --build .
        
    - name: Generate Glide2x Dynamic Link Library (Windows, x64)
      run: |
        mkdir bin_win_x64
        cd bin_win_x64
        cmake -DCMAKE_TOOLCHAIN_FILE=mingw-w64-x86_64.cmake -DCMAKE_INSTALL_PREFIX=../prefix-64 ..
        cmake --build .

    - name: Show PE Headers and Imports of Glide2x DLL (Windows, x64)
      run: |
        for dll in bin_win_x64/*.dll; do
          x86_64-w64-mingw32-objdump -p "$dll"
        done

    - name: Generate Glide2x Dynamic Link Library (Windows, x32)
      run: |
        mkdir bin_win_x32
        cd bin_win_x32
        cmake -DCMAKE_TOOLCHAIN_FILE=mingw-w64-x86_32.cmake -DBUILD_32BIT=ON -DCMAKE_INSTALL_PREFIX=../prefix-32 ..
        cmake --build .

    - name: Show PE Headers and Imports of Glide2x DLL (Windows, x32)
      run: |
        for dll in bin_win_x32/*.dll; do
          i686-w64-mingw32-objdump -p "$dll"
        done
        
    - name: Upload Built Glide2x Library
      uses: actions/upload-artifact@v4
      with:
        name: glide2x
        path: |
            glide2x/cvg/bin_x32/*.so
            glide2x/cvg/bin_x64/*.so
            glide2x/cvg/bin_win_x64/*.dll
            glide2x/cvg/bin_win_x32/*.dll
        
